<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Aetheria Soft-Clay Declarative Story</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #93C5FD;
      font-family: "Inter", sans-serif;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #93C5FD 0%, #BAE6FD 48%, #E0F2FE 100%);
    }
    #stage canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: block;
    }
  </style>
  <script src="/script/three.min.js"></script>
  <script src="/script/aetheria-motion.js"></script>
  <script src="/script/clay-kit.js"></script>
  <script src="/script/clay-assets.js"></script>
  <script src="/script/story-runtime.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="stage-webgl" width="1080" height="1920"></canvas>
    <canvas id="stage-hud" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var storyUrl = params.get("story") || "/story.json";
      var isMicrostock = params.get("microstock") === "1";
      window.StoryRuntime.boot({
        glCanvas: document.getElementById("stage-webgl"),
        hudCanvas: document.getElementById("stage-hud"),
        storyUrl: storyUrl,
        fallbackStoryUrl: "/story.example.json",
        isMicrostock: isMicrostock
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Aetheria Product Keynote Showreel</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0A0A0C;
      font-family: "Inter", sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="/script/aetheria-motion.js"></script>
  <script src="/script/keynote-kit.js"></script>
  <script src="/script/keynote-layouts.js"></script>
  <script src="/script/story-runtime.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="stage-2d" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var storyUrl = params.get("story") || "/story.json";
      var isMicrostock = params.get("microstock") === "1";
      window.StoryRuntime.boot({
        canvas: document.getElementById("stage-2d"),
        storyUrl: storyUrl,
        fallbackStoryUrl: "/story.example.json",
        isMicrostock: isMicrostock
      });
    })();
  </script>
</body>
</html>

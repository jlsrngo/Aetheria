<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Spatial Motion Story</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #FDE8F0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; width: 1080px; height: 1920px; max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
  <script src="/script/three.min.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="stage-webgl" width="1080" height="1920"></canvas>
    <canvas id="stage-hud" width="1080" height="1920"></canvas>
  </div>
  <script src="script/spatial-kit.js"></script>
  <script src="/script/story-core.js"></script>
  <script src="script/story-runtime.js"></script>
</body>
</html>
